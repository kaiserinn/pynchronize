services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8001:8000"
    environment:
      - NODE_ID=node1
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8000
      - CLUSTER_NODES=node1:8000,node2:8000,node3:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELECTION_TIMEOUT_MIN=150
      - ELECTION_TIMEOUT_MAX=300
      - HEARTBEAT_INTERVAL=50
      - LOG_LEVEL=INFO
      - CACHE_MAX_SIZE=1000
      - QUEUE_PERSISTENCE_PATH=/data/queue
    volumes:
      - node1_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - distributed_net

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8002:8000"
    environment:
      - NODE_ID=node2
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8000
      - CLUSTER_NODES=node1:8000,node2:8000,node3:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELECTION_TIMEOUT_MIN=150
      - ELECTION_TIMEOUT_MAX=300
      - HEARTBEAT_INTERVAL=50
      - LOG_LEVEL=INFO
      - CACHE_MAX_SIZE=1000
      - QUEUE_PERSISTENCE_PATH=/data/queue
    volumes:
      - node2_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - distributed_net

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8003:8000"
    environment:
      - NODE_ID=node3
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8000
      - CLUSTER_NODES=node1:8000,node2:8000,node3:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELECTION_TIMEOUT_MIN=150
      - ELECTION_TIMEOUT_MAX=300
      - HEARTBEAT_INTERVAL=50
      - LOG_LEVEL=INFO
      - CACHE_MAX_SIZE=1000
      - QUEUE_PERSISTENCE_PATH=/data/queue
    volumes:
      - node3_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - distributed_net

networks:
  distributed_net:
    driver: bridge

volumes:
  redis_data:
  node1_data:
  node2_data:
  node3_data:
